name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test Burp extension
        working-directory: extension
        run: ./gradlew test shadowJar --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: burp-mcp-extension
          path: extension/build/libs/*.jar